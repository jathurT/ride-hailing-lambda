# Ride-Hailing Fleet Operations - Lambda architecture pipeline.
#
# Organised into PROFILES because the host has 15.6 GB of RAM and Docker
# realistically gets ~11 GB (see plan/10 section 0.2). Services with no `profiles`
# key always start; the rest are opt-in:
#
#   make up-core   (no profile)  ~5.6 G   pipeline only
#   make up        COMPOSE_PROFILES=run   ~8.2 G   + Kafka UI + Airflow   <- DEFAULT
#   make up-obs    COMPOSE_PROFILES=obs   ~9.9 G   + Prometheus/Grafana/Alertmanager
#   make up-full   COMPOSE_PROFILES=full  ~12.4 G  + Jaeger/OTel + Spark cluster
#
# Profiles do not nest in Compose, so a service that should appear from `run`
# upwards lists every profile at or above it.

name: fleet

x-logging: &default-logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:

  # --- ingestion backbone -------------------------------------------------

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: fleet-kafka
    hostname: kafka
    ports:
      - "9092:9092"          # host access (localhost:9092)
    environment:
      # KRaft: no ZooKeeper. The lecture notes ZooKeeper was used "before version
      # 2.8"; we run 3.x, so the ensemble in the lecture diagram is absent by
      # design, not by oversight. Declared in the report - see plan/02 section 2.
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # A typo in a topic name must fail loudly, not silently create a topic with
      # default settings - which for a compacted topic would be the wrong policy.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Without this the JVM sizes its heap from HOST ram and over-commits.
      KAFKA_HEAP_OPTS: "-Xmx768m -Xms512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    mem_limit: 1500m
    logging: *default-logging

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: fleet-schema-registry
    hostname: schema-registry
    depends_on:
      kafka: { condition: service_healthy }
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      # BACKWARD: new consumers can read old data. Correct here because the
      # streaming job is redeployed far more often than the producers, and it is
      # what lets us add a nullable field without breaking anything.
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xmx384m"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 512m
    logging: *default-logging

  # --- storage layers -----------------------------------------------------

  minio:
    # Bitnami's archive, not minio/minio. The official repository has been removed
    # from Docker Hub (and its quay.io tags with it), so the pinned
    # minio/minio:RELEASE.2024-06-13T22-53-53Z fails with "pull access denied".
    # This image carries the SAME MinIO build (2024-06-13T22-53-53Z, commit 20960b6),
    # so behaviour is unchanged. Three differences follow from the Bitnami layout:
    # its own run.sh starts the server (API :9000, console :9001), data lives in
    # /bitnami/minio/data, and `mc` is not on PATH - hence the absolute path below.
    image: bitnamilegacy/minio:2024.6.13
    container_name: fleet-minio
    ports:
      - "9000:9000"
      - "9001:9001"      # console: browse the master dataset and the reports
    environment:
      MINIO_ROOT_USER: ${STORE_MINIO_ACCESS_KEY:-fleetadmin}
      MINIO_ROOT_PASSWORD: ${STORE_MINIO_SECRET_KEY:-fleetadmin}
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/minio-client/bin/mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    mem_limit: 512m
    logging: *default-logging

  postgres-mart:
    image: postgres:16-alpine
    container_name: fleet-postgres-mart
    ports:
      # 5442, not 5432: this machine already runs a native PostgreSQL on the
      # default port. Docker silently failed to publish rather than erroring, so
      # host tools connected to the wrong database. Non-default host ports keep
      # the project isolated from whatever else the machine happens to run.
      - "5442:5432"
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      POSTGRES_DB: fleet_mart
    volumes:
      - postgres-mart-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet_mart"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 512m
    logging: *default-logging

  redis:
    image: redis:7.2-alpine
    container_name: fleet-redis
    # Persistence OFF, deliberately: the speed view is disposable by design, and
    # disabling it removes fork-based snapshot pauses. See ADR-004.
    command: ["redis-server", "--appendonly", "no", "--save", "", "--maxmemory", "192mb",
              "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6389:6379"      # 6389, not 6379: native Redis already owns the default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    logging: *default-logging

  # --- one-shot bootstrap -------------------------------------------------

  init:
    build:
      context: .
      dockerfile: docker/init/Dockerfile
    container_name: fleet-init
    depends_on:
      kafka: { condition: service_healthy }
      schema-registry: { condition: service_healthy }
      minio: { condition: service_healthy }
      postgres-mart: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: [.env]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      STORE_MINIO_ENDPOINT: http://minio:9000
      STORE_POSTGRES_DSN: postgresql://fleet:fleet@postgres-mart:5432/fleet_mart
      STORE_REDIS_URL: redis://redis:6379/0
      SIM_STATE_PATH: /state/sim_epoch.json
      # Passed through from the host shell. init refuses to run over an existing
      # simulation - starting a new run on old data produces incoherent dates and
      # trends with nothing reporting an error - and RESUME=1 is the documented way
      # past that guard. Without this line the guard's own error message advertises
      # a flag that cannot reach the container, which is worse than having no flag.
      RESUME: ${RESUME:-}
    volumes:
      - ./state:/state
      - ./sql:/app/sql:ro
    restart: "no"
    mem_limit: 256m
    logging: *default-logging

  # --- operator UIs (profile: run and above) ------------------------------

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: fleet-kafka-ui
    profiles: ["run", "obs", "full"]
    depends_on:
      kafka: { condition: service_healthy }
      schema-registry: { condition: service_healthy }
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: fleet
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      # Wired to the registry so Avro payloads are readable in the browser - the
      # mitigation for Avro's "you can't cat a message" downside (plan/02 section 10).
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      DYNAMIC_CONFIG_ENABLED: "true"
      JAVA_OPTS: "-Xmx256m"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 384m
    logging: *default-logging

  # --- simulated sources --------------------------------------------------

  registry-producer:
    build: { context: ., dockerfile: docker/producer/Dockerfile }
    container_name: fleet-registry-producer
    command: ["python", "-m", "fleet.ingestion.registry_producer"]
    depends_on:
      init: { condition: service_completed_successfully }
    env_file: [.env]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      SIM_STATE_PATH: /state/sim_epoch.json
    volumes:
      - ./state:/state
    restart: "no"
    mem_limit: 256m
    logging: *default-logging

  telemetry-producer:
    build: { context: ., dockerfile: docker/producer/Dockerfile }
    container_name: fleet-telemetry-producer
    depends_on:
      init: { condition: service_completed_successfully }
      registry-producer: { condition: service_completed_successfully }
    ports:
      - "8001:8001"
    env_file: [.env]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      SIM_STATE_PATH: /state/sim_epoch.json
      OBS_METRICS_PORT: 8001
    volumes:
      - ./state:/state
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    mem_limit: 256m
    logging: *default-logging

  expense-dropper:
    build: { context: ., dockerfile: docker/producer/Dockerfile }
    container_name: fleet-expense-dropper
    command: ["python", "-m", "fleet.ingestion.expense_dropper",
              "--bucket", "fleet-lake"]
    depends_on:
      init: { condition: service_completed_successfully }
    ports:
      - "8002:8002"
    env_file: [.env]
    environment:
      SIM_STATE_PATH: /state/sim_epoch.json
      OBS_METRICS_PORT: 8002
      STORE_MINIO_ENDPOINT: http://minio:9000
    volumes:
      - ./state:/state
      - ./landing:/landing
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8002/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    mem_limit: 256m
    logging: *default-logging

  # --- spark application --------------------------------------------------

  # The serving layer (plan/07). Core profile - it is not an extra, it is where the
  # Lambda merge actually happens, and the demo is driven through it.
  api:
    build: { context: ., dockerfile: docker/api/Dockerfile }
    container_name: fleet-api
    depends_on:
      postgres-mart: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "8000:8000"
    env_file: [.env]
    environment:
      STORE_POSTGRES_DSN: postgresql://fleet:fleet@postgres-mart:5432/fleet_mart
      STORE_REDIS_URL: redis://redis:6379/0
      SIM_STATE_PATH: /state/sim_epoch.json
      OBS_SERVICE_NAME: serving-api
    volumes:
      - ./state:/state:ro
    healthcheck:
      # /health/live, never /health/ready: a readiness probe here would restart the
      # API whenever Postgres blipped, which is the exact opposite of degrading
      # gracefully.
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    mem_limit: 256m
    logging: *default-logging

  # Two Spark containers from ONE image, because they have different lifetimes.
  #
  # `streaming-job` is the speed layer: a long-running driver that must stay up for
  # the whole run. `spark-app` is a batch executor that idles until Airflow execs a
  # job into it. They cannot be the same container - a batch driver starting inside
  # the streaming container would contend for one 1.6 G limit, and the first symptom
  # would be the streaming queries dying in the middle of a demo.
  #
  # This is the split plan/10 section 1.1 already specifies (`streaming-job`, 4040).

  streaming-job:
    build: { context: ., dockerfile: docker/spark-app/Dockerfile }
    container_name: fleet-streaming-job
    depends_on:
      init: { condition: service_completed_successfully }
    ports:
      - "4040:4040"      # Structured Streaming UI
    env_file: [.env]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      STORE_MINIO_ENDPOINT: http://minio:9000
      STORE_POSTGRES_DSN: postgresql://fleet:fleet@postgres-mart:5432/fleet_mart
      STORE_REDIS_URL: redis://redis:6379/0
      SIM_STATE_PATH: /state/sim_epoch.json
      OBS_SERVICE_NAME: speed-layer
    volumes:
      - ./state:/state
      - ./scripts:/app/scripts:ro
    command: ["python", "-m", "fleet.speed_layer.streaming_job"]
    restart: unless-stopped
    mem_limit: 1600m
    logging: *default-logging

  spark-app:
    build: { context: ., dockerfile: docker/spark-app/Dockerfile }
    container_name: fleet-spark-app
    depends_on:
      init: { condition: service_completed_successfully }
    env_file: [.env]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      STORE_MINIO_ENDPOINT: http://minio:9000
      STORE_POSTGRES_DSN: postgresql://fleet:fleet@postgres-mart:5432/fleet_mart
      STORE_REDIS_URL: redis://redis:6379/0
      SIM_STATE_PATH: /state/sim_epoch.json
      OBS_SERVICE_NAME: batch-layer
    volumes:
      - ./state:/state
      - ./scripts:/app/scripts:ro
    # Idles so Airflow can `docker exec` batch jobs into it. The image's default CMD
    # is a one-shot version probe that exits immediately, leaving nothing to exec
    # into: the container reads "Exited (0)" and the DAG fails with "No such
    # container", which looks like a compose bug rather than a lifetime one.
    command: ["sleep", "infinity"]
    restart: unless-stopped
    mem_limit: 1600m
    logging: *default-logging

  # --- orchestration (profile: run) ---------------------------------------
  #
  # Airflow gets its OWN Postgres. Sharing the mart database would put scheduler
  # metadata - thousands of rows per hour of task instances and logs - in the same
  # database the report queries, and a `make clean` of one would take the other.

  airflow-postgres:
    image: postgres:16-alpine
    container_name: fleet-airflow-postgres
    profiles: ["run", "obs", "full"]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 200m
    logging: *default-logging

  airflow-init:
    build: { context: ., dockerfile: docker/airflow/Dockerfile }
    container_name: fleet-airflow-init
    profiles: ["run", "obs", "full"]
    depends_on:
      airflow-postgres: { condition: service_healthy }
    environment: &airflow-env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
      # JSON logs, so Airflow's output is greppable alongside every other service's.
      AIRFLOW__LOGGING__JSON_FORMAT: "true"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.session
      PYTHONPATH: /opt/airflow/src
      # The DAG's own tasks talk to the mart and the speed view directly.
      STORE_POSTGRES_DSN: postgresql://fleet:fleet@postgres-mart:5432/fleet_mart
      STORE_REDIS_URL: redis://redis:6379/0
      STORE_MINIO_ENDPOINT: http://minio:9000
      SIM_STATE_PATH: /state/sim_epoch.json
      OBS_SERVICE_NAME: airflow
    volumes: &airflow-volumes
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./src:/opt/airflow/src:ro
      - ./state:/state:ro
      - airflow-logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create --username admin --password admin \
          --firstname fleet --lastname ops --role Admin --email ops@fleet.local || true
    mem_limit: 900m
    logging: *default-logging

  airflow-scheduler:
    build: { context: ., dockerfile: docker/airflow/Dockerfile }
    container_name: fleet-airflow-scheduler
    profiles: ["run", "obs", "full"]
    depends_on:
      airflow-init: { condition: service_completed_successfully }
    environment: *airflow-env
    volumes: *airflow-volumes
    # Runs as root so the mounted docker socket is usable. Noted rather than hidden:
    # this is a local demo stack, and the alternative is matching the host's docker
    # group id, which is not portable across machines.
    user: "0:0"
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $$(hostname)"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 90s
    mem_limit: 900m
    logging: *default-logging

  airflow-webserver:
    build: { context: ., dockerfile: docker/airflow/Dockerfile }
    container_name: fleet-airflow-webserver
    profiles: ["run", "obs", "full"]
    depends_on:
      airflow-init: { condition: service_completed_successfully }
    environment:
      <<: *airflow-env
      # TWO gunicorn workers, not the default four.
      #
      # The default killed this container. Each Airflow webserver worker is roughly
      # 250-350 MB, so four of them do not fit inside the 900 MB limit below: the
      # workers were OOM-killed, gunicorn's master stopped responding, and the
      # webserver exited 1.
      #
      # It then stayed down for three hours WITHOUT anything noticing, because the
      # scheduler is a separate container and kept running DAGs perfectly. The
      # pipeline was healthy the whole time; only the window onto it was gone. That
      # is worth remembering when claiming a system is "observable" - the observability
      # tooling is just more software, and it fails like software.
      AIRFLOW__WEBSERVER__WORKERS: "2"
      AIRFLOW__WEBSERVER__WORKER_REFRESH_BATCH_SIZE: "1"
    volumes: *airflow-volumes
    ports:
      - "8082:8080"      # 8080 is Kafka UI; the container keeps Airflow's default
    command: webserver
    # Without this the container stays dead after an OOM. The scheduler keeps working,
    # so nothing else degrades and the outage is invisible until someone opens the UI.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 120s
    mem_limit: 1100m
    logging: *default-logging

  # --- observability (profile: obs) ---------------------------------------
  #
  # Opt-in because the host has ~11 GB for Docker and the pipeline itself takes most
  # of it. `make up-obs` adds roughly 0.8 GB.

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: fleet-prometheus
    profiles: ["obs", "full"]
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 6 hours is plenty: a simulated day is 5 real minutes, so this holds ~72
      # simulated days. Keeping more would only slow start-up during the demo.
      - --storage.tsdb.retention.time=6h
      - --web.enable-lifecycle
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    mem_limit: 400m
    logging: *default-logging

  # Spark's streaming queries cannot be scraped - they run in the driver with no HTTP
  # endpoint - so the driver pushes here instead. See fleet/speed_layer/listener.py
  # for why consumer lag is not an acceptable substitute.
  pushgateway:
    image: prom/pushgateway:v1.9.0
    container_name: fleet-pushgateway
    profiles: ["obs", "full"]
    ports:
      - "9091:9091"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9091/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 64m
    logging: *default-logging

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: fleet-kafka-exporter
    profiles: ["obs", "full"]
    depends_on:
      kafka: { condition: service_healthy }
    command: ["--kafka.server=kafka:29092"]
    ports:
      - "9308:9308"
    mem_limit: 64m
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: fleet-alertmanager
    profiles: ["obs", "full"]
    ports:
      - "9093:9093"
    volumes:
      - ./observability/alertmanager:/etc/alertmanager:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 64m
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.1.0
    container_name: fleet-grafana
    profiles: ["obs", "full"]
    depends_on:
      prometheus: { condition: service_healthy }
    ports:
      - "3000:3000"
    environment:
      # Anonymous admin: this is a local demo stack, and a login prompt between the
      # examiner and the dashboard is friction with no security value here.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
      # Queries the serving layer's own API so the dashboard exercises the merge
      # rather than bypassing it (plan/07 section 6). Needs network access on first
      # start; if it fails, every Prometheus panel still renders.
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 5s
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 256m
    logging: *default-logging

volumes:
