apiVersion: 1

providers:
  - name: fleet
    orgId: 1
    folder: Fleet
    type: file
    disableDeletion: false
    # Editable in the UI so a panel can be tweaked live during the demo, but the file
    # on disk stays the source of truth - a container restart restores it.
    allowUiUpdates: true
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
